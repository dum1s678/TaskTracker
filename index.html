<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Заявки корпуса:</h1>
    <label for="issue">Что случилось?</label>
    <input type="text" name="" id="issue">
    <p id="issueMessage"></p>
    <label for="place">Где?</label>
    <input type="text" name="" id="place">
    <p id="placeMessage"></p>
    <label for="category">Категория:</label>
    <select name="" id="category">
        <option value="notSelected">Выберите категорию</option>
        <option value="Оборудование">Оборудование</option>
        <option value="Аудитория">Аудитория</option>
        <option value="Другое">Другое</option>
    </select>
    <p id="categoryMessage"></p>
    <button type="button" id="addApplication">Отправить заявку</button>
    <label for="checkbox">Только открытые:</label>
    <input type="checkbox" name="" id="checkbox">
    <ul id="listApplication"></ul>
</body>
</html>
